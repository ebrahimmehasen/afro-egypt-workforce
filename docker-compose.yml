# MySQL for local development / small self-hosted deployments.
#   docker compose up -d
# Then set DATABASE_URL in .env to:
#   mysql://afro:afro_dev_pw@localhost:3306/afro_egypt_workforce
services:
  mysql:
    image: mysql:8.4
    container_name: afro-egypt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pw
      MYSQL_DATABASE: afro_egypt_workforce
      MYSQL_USER: afro
      MYSQL_PASSWORD: afro_dev_pw
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - afro_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_pw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afro_mysql_data:
